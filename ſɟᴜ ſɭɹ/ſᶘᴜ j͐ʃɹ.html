<body class="cepufal">
    <thala>
        <maxema class="c2w2qkuba">
            <button onclick='envolviTekston("≺⧼ "," ⧽≻")'>≺⧼ ⧽≻</button>
            <button onclick='envolviTekston("⟪ "," ⟫")'>⟪ ⟫</button>
            <button onclick='envolviTekston("⟨ "," ⟩")'>⟨ ⟩</button>
            <sak></sak>
            <button onclick='envolviTekston("≺ "," ≻")'>≺ ≻</button>
            <button onclick='envolviTekston("• "," •")'>• •</button>
        </maxema>
    </thala>
    <textarea id="k1al2" data-oskakefani="k4cak2-saxe"></textarea>
    <button onclick="konserviNoton()" data-oskakefani="ca12na-fezi"></button>
    <p id="c2ksak" style="opacity: 0; transition: opacity 0.25s;" data-oskakefani="k61e-3akak"></p>
</body>
<script>
    const notoTeksto = document.getElementById("k1al2");
    const stato = document.getElementById("c2ksak");
    notoTeksto.value = localStorage.getItem("notetaker-notes") || "";
    function konserviNoton() {
        const blob = new Blob([notoTeksto.value], { type: "text/plain" });
        const ligilo = document.createElement("a");
        ligilo.href = URL.createObjectURL( blobo );
        ligilo.download = "ſᶘᴜ j͐ʃɹ.txt";
        ligilo.click();
        URL.revokeObjectURL( ligilo.href );
        stato.style.opacity = "1";
        setTimeout( () => stato.style.opacity = "0", 0o3000 );
    }
    function envolviTekston( antaux, post ) {
        const komenco = notoTeksto.selectionStart;
        const fino = notoTeksto.selectionEnd;
        const elektita = notoTeksto.value.substring( komenco, fino );
        const envolvita = antaux + elektita + post;
        notoTeksto.setRangeText( envolvita, komenco, fino, "select" );
        notoTeksto.focus();
        if ( elektita.length === 0 ) {
            const kursoPozicio = komenco + antaux.length;
            notoTeksto.setSelectionRange( kursoPozicio, kursoPozicio );
        }
    }

    const skakefani = {

        },
        en: {

            "k61e-3akak": "Saved ✅"
        }
    };
</script>
