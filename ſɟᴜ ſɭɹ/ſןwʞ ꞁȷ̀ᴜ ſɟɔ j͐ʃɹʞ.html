<script>
    const urlBreto = document.getElementById("k6h6-kek");
    const kadro = document.getElementById("kfeni-kuba");
    const konservita = localStorage.getItem("browser-url");
    if ( konservita ) { urlBreto.value = konservita; kadro.src = konservita; }
    function iri() {
        let retadres = urlBreto.value;
        if ( !retadres.startsWith( "http" ) ) retadres = "https://" + retadres;
        kadro.src = retadres;
        localStorage.setItem( "browser-url", retadres );
    }
    urlBreto.addEventListener( "keydown", ( e ) => { if ( e.key === "Enter" ) iri(); } );
