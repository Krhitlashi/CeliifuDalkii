<!DOCTYPE html>
<html lang="aih">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="inline-size=device-inline-size, initial-scale=1">

    <title data-oskakefani="ku1o-ksaka">ſɭw ſᶘɜ ⚙️</title>
    <link rel="icon" type="image/x-icon" href="../../../j͑ʃɹ ɭʃᴜɔ˞ ɭl̀ɔ j͑ʃᴜꞇ.ico">
    
    <link rel="manifest" href="../ſɟᴜ ſɭɹ ſɟɔ j͐ʃɹʞ ꞁȷ̀ᴜꞇ.json">

</head>

<body class="cepufal">
    <h1 data-oskakefani="ku1o-ksaka"></h1>

    <thala>
        <p class="ksakap2sa" data-oskakefani="ku1o-tom6nu"></p>
        <select id="ku1o-tom6nu">
            <option value="cak2p2" data-oskakefani="ku1o-tom6nu-cak2p2"></option>
            <option value="quni" data-oskakefani="ku1o-tom6nu-quni"></option>
            <option value="huna" data-oskakefani="ku1o-tom6nu-huna"></option>
        </select>
    </thala>

    <thala>
        <p class="ksakap2sa" data-oskakefani="ku1o-tahaq-cafas"></p>
        <input type="text" id="tahaq-cafas-k6h6" placeholder="ſןwʞ ꞁȷ̀ᴜ ſɟɔ ſɭɹ" data-oskakefani="ku1o-tahaq-cafas-k6h6">
    </thala>

    <thala>
        <p class="ksakap2sa" data-oskakefani="ku1o-tahaq-cafas-ks2bu"></p>
        <ciihii>
            <label>
                <p data-oskakefani="ks2bu-saxe"></p>
                <input type="color" id="ks2bu-saxe" value="#6070e0">
            </label>
            <label>
                <p data-oskakefani="ks2bu-3akak"></p>
                <input type="color" id="ks2bu-k3akak" value="#7040a0">
            </label>
        </ciihii>
        <button id="ca12na-ks2bu" data-oskakefani="ca12na-ks2bu"></button>
        <sak></sak>
        <button id="sakxo-ks2bu" data-oskakefani="sakxo-ks2bu"></button>
        <button id="ca12na-qun2-tahaq-cafas" data-oskakefani="ca12na-qun2-tahaq-cafas"></button>
    </thala>

    <sak></sak>

    <thala>
        <p class="ksakap2sa" data-oskakefani="ksaka-cafas"></p>
        <select id="ksaka-cafas">
            <option value="cepu" selected data-oskakefani="ksaka-cepu"></option>
            <option value="j6se" data-oskakefani="ksaka-j6se"></option>
            <option value="qun2" data-oskakefani="ksaka-qun2"></option>
        </select>
    </thala>

    <thala>
        <p class="ksakap2sa" data-oskakefani="caqaxak2p2-pal6"></p>
        <span id="caqaxak2p2-pal6-vop2"></span>
        <input type="range" min="48" max="112" step="8" value="64" id="caqaxak2p2-pal6">
    </thala>

    <thala>
        <p class="ksakap2sa" data-oskakefani="caqaxak2p2-ca1ara"></p>
        <label>
            <p data-oskakefani="caqaxak2p2-raqa"></p>
            <select id="caqaxak2p2-raqa">
                <option value="ctama" selected data-oskakefani="ctama"></option>
                <option value="ptama" data-oskakefani="ptama"></option>
                <option value="psaz" data-oskakefani="psaz"></option>
                <option value="soza" data-oskakefani="soza"></option>
            </select>
        </label>
    </thala>

    <sak></sak>

    <thala>
        <p class="ksakap2sa" data-oskakefani="ku1o-gawe"></p>
        <select id="gawe">
        </select>
    </thala>

    <thala>
        <p class="ksakap2sa" data-oskakefani="catama-ca1ara"></p>
        <label>
            <input type="checkbox" id="catama-ca1ara-p6sca" checked>
            <span data-oskakefani="catama-ca1ara-p6sca"></span>
        </label>
    </thala>

    <sak></sak>

    <button id="ca12na-qun2-3aqk2p2" data-oskakefani="ca12na-qun2-3aqk2p2"></button>
</body>
<script>
    function send(action, value) {
        window.parent.postMessage({ source: "settings", action, value }, "*");
    }
    document.getElementById("ku1o-tom6nu").onchange = e => send("setTheme", e.target.value);
    document.getElementById("tahaq-cafas-k6h6").onchange = e => send("setWallpaper", e.target.value);
    
    document.getElementById("ca12na-ks2bu").onclick = () => {
        const start = document.getElementById("ks2bu-saxe").value;
        const end = document.getElementById("ks2bu-k3akak").value;
        send("setGradientWallpaper", { start, end });
    };
    document.getElementById("sakxo-ks2bu").onclick = () => {
        send("setRandomGradientWallpaper", null);
    };
    document.getElementById("ca12na-qun2-tahaq-cafas").onclick = () => {
        send("clearWallpaper", null);
    };
    
    document.getElementById("caqaxak2p2-pal6").oninput = e => {
        document.getElementById("caqaxak2p2-pal6-vop2").innerText = e.target.value + "px";
        send("updateTaskbarSettings", e.target.value);
    };
    document.getElementById("ksaka-cafas").onchange = e => send("setLabelDisplay", e.target.value);
    document.getElementById("gawe").onchange = e => send("setLanguage", e.target.value);
    document.getElementById("caqaxak2p2-raqa").onchange = e => send("setTaskbarPosition", e.target.value);
    document.getElementById("catama-ca1ara-p6sca").onchange = e => send("setMobileGridSeparate", e.target.checked ? "h6w6" : "qun2");
    document.getElementById("ca12na-qun2-3aqk2p2").onclick = () => {
        localStorage.clear();
        location.reload();
    };

    document.getElementById("ku1o-tom6nu").value = localStorage.getItem("tom6nu") || "cak2p2";
    document.getElementById("tahaq-cafas-k6h6").value = localStorage.getItem("tahaq-cafas") || "";
    
    const savedGradient = JSON.parse(localStorage.getItem("tahaq-cafas-weh2") || "null");
    if ( savedGradient ) {
        document.getElementById("ks2bu-saxe").value = savedGradient.start || "#6870e8";
        document.getElementById("ks2bu-k3akak").value = savedGradient.end || "#7840a8";
    }
    
    document.getElementById("caqaxak2p2-raqa").value = localStorage.getItem("caqaxak2p2-raqa") || "ctama";
    document.getElementById("catama-ca1ara-p6sca").checked = (localStorage.getItem("catama-ca1ara-p6sca") || "h6w6") !== "qun2";
    const savedTaskbarSize = localStorage.getItem("caqaxak2p2-pal6") || "48";
    document.getElementById("caqaxak2p2-pal6").value = savedTaskbarSize;
    document.getElementById("caqaxak2p2-pal6-vop2").innerText = savedTaskbarSize + "px";

    function initDynamicContent() {
        const langSelect = document.getElementById("gawe");
        if ( !langSelect || langSelect.options.length > 0 ) return;

        const langNames = { aih: "ꞁȷ̀ɹ ſɭˬɔ", en: "English", ja: "日本語", ar: "العربية" };

        Object.keys( skakefani ).forEach( lang => {
            const option = document.createElement( "option" );
            option.value = lang;
            option.innerText = langNames[ lang ] || lang;
            langSelect.appendChild( option );
        } );

        langSelect.value = document.documentElement.lang || "aih";
    }

    window.onload = function() {
        if ( typeof k2regawe === "function" ) {
            k2regawe( document.documentElement.lang || "aih" );
        }
        initDynamicContent();
    };
</script>
